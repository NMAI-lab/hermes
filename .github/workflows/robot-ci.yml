name: Robot Build CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "ROS distro to build against"
        required: false
        default: "humble"
        type: string

env:
  ROS_DISTRO: ${{ github.event.inputs.ros_distro || 'humble' }}

jobs:
  build-robot-image:
    # Native arm64 hosted runner - no QEMU emulation, matches real robot hardware.
    # ubuntu-24.04-arm / ubuntu-22.04-arm are free on public repos; on private repos
    # they require a paid plan with arm64 standard runners enabled.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Dockerfile hash
        id: dockerhash
        run: echo "hash=$(sha256sum Dockerfile.robot | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build hermes-robot image (native ARM64, cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.robot
          tags: |
            hermes-robot:latest
            hermes-robot:${{ steps.dockerhash.outputs.hash }}
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
          load: true
          cache-from: type=gha,scope=robot
          cache-to: type=gha,mode=max,scope=robot