name: Simulation CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "ROS distro to build/test against"
        required: false
        default: "foxy"
        type: string
      num_trials:
        description: "Number of simulation trials to run"
        required: false
        default: "5"
        type: string

env:
  ROS_DISTRO: ${{ github.event.inputs.ros_distro || 'foxy' }}
  NUM_TRIALS: ${{ github.event.inputs.num_trials || '5' }}

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    outputs:
      plot-files: ${{ steps.list-plots.outputs.files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Dockerfile hash
        id: dockerhash
        run: echo "hash=$(sha256sum Dockerfile.simulator | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build hermes-sim image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.simulator
          tags: |
            hermes-sim:latest
            hermes-sim:${{ steps.dockerhash.outputs.hash }}
          build-args: |
            ARCH=amd64
            ROS_DISTRO=${{ env.ROS_DISTRO }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plotting dependencies
        run: pip install -r miscellaneous/data_analysis/requirements.txt

      - name: Clean previous plot data
        run: |
          rm -rf miscellaneous/data_analysis/metrics_analysis/plots
          rm -rf miscellaneous/data_analysis/metrics_analysis/data
          mkdir -p miscellaneous/data_analysis/metrics_analysis/plots
          mkdir -p miscellaneous/data_analysis/metrics_analysis/data

      - name: Run simulation trials
        run: |
          chmod +x ./run_experiments.sh
          ./run_experiments.sh ${{ env.NUM_TRIALS }} ${{ env.ROS_DISTRO }}

      - name: Generate plots
        run: |
          cd miscellaneous/data_analysis/metrics_analysis
          python metrics_parser.py

      - name: List simulator plots
        id: list-plots
        run: |
          cd miscellaneous/data_analysis/metrics_analysis/plots
          files=$(ls *_simulator.png 2>/dev/null | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Stage plots for handoff
        uses: actions/upload-artifact@v4
        with:
          name: plots-staging-${{ github.run_id }}
          path: miscellaneous/data_analysis/metrics_analysis/plots/*_simulator.png
          retention-days: 1

  publish-plots:
    needs: run-simulation
    if: needs.run-simulation.outputs.plot-files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.run-simulation.outputs.plot-files) }}

    steps:
      - name: Download staged plots
        uses: actions/download-artifact@v4
        with:
          name: plots-staging-${{ github.run_id }}
          path: plots

      - name: Upload plot as its own artifact
        uses: actions/upload-artifact@v7
        with:
          path: plots/${{ matrix.file }}
          archive: false